[project]
name = "pixelbuds-gui"
version = "0.1.1"
description = "Desktop GUI to control Google Pixel Buds Pro on Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
]

[project.scripts]
pixelbuds-gui = "pixelbuds_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelbuds_gui"]
