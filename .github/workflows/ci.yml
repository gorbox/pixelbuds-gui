name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Qt offscreen runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Install project deps
        run: uv sync

      - name: Smoke tests (offscreen, no Bluetooth)
        run: uv run python tests/smoke.py
        env:
          QT_QPA_PLATFORM: offscreen
